<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bruce Lucky - Portfolio Content Manager" />
  <title>Bruce Lucky Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../admin.css" />

  <!-- PWA metadata lives here only. The public portfolio at / must not link a
       manifest, or Chrome offers to install the site as an app. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dashboard" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/dashboard/icons/icon-192.png" />

  <!-- Chrome fires beforeinstallprompt shortly after load, which can be before
       the app bundle has evaluated. Capture it here and stash it on window so
       the Install button can never miss the event. Calling preventDefault
       suppresses Chrome's own mini-infobar. This document is served only at
       /dashboard, so none of this touches the public portfolio. -->
  <script>
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__pwaInstallPrompt = event;
      window.dispatchEvent(new CustomEvent('pwa-installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaInstallPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });
  </script>

  <script type="module" src="../src/main.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
